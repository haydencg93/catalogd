<svg xmlns="http://www.w3.org/2000/svg">

    <!--
        Catalogd Media Navigation Icons

        Icons adapted from Lucide:
        https://lucide.dev/
        https://github.com/lucide-icons/lucide

        Licenses: ISC / MIT (Feather-derived icons)
        Full license notices: LICENSES.txt

        Modifications:
        - White strokes
        - SVG symbol formatting
        - Standardized navigation sizing

        Anime dot: Custom Catalogd geometric icon.
    -->

    <!-- MOVIES: Film -->
    <symbol id="media-icon-movie" viewBox="0 0 24 24">
        <g fill="none"
           stroke="#ffffff"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">

            <rect x="2" y="2" width="20" height="20" rx="2.5"/>
            <path d="M7 2v20"/>
            <path d="M17 2v20"/>
            <path d="M2 12h20"/>
            <path d="M2 7h5"/>
            <path d="M2 17h5"/>
            <path d="M17 7h5"/>
            <path d="M17 17h5"/>

        </g>
    </symbol>

    <!-- TV SHOWS: Television -->
    <symbol id="media-icon-tv" viewBox="0 0 24 24">
        <g fill="none"
           stroke="#ffffff"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">

            <path d="m17 2-5 5-5-5"/>
            <rect x="2" y="7" width="20" height="15" rx="2"/>

        </g>
    </symbol>

    <!-- ANIME: Centered white dot -->
    <symbol id="media-icon-anime" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="7.5" fill="#ffffff"/>
    </symbol>

    <!-- BOOKS: Open book -->
    <symbol id="media-icon-book" viewBox="0 0 24 24">
        <g fill="none"
           stroke="#ffffff"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">

            <path d="M12 7v14"/>
            <path d="M3 18V5a1 1 0 0 1 1-1h3
                     a5 5 0 0 1 5 5
                     a5 5 0 0 1 5-5h3
                     a1 1 0 0 1 1 1v13
                     a1 1 0 0 1-1 1h-3
                     a5 5 0 0 0-5 2
                     a5 5 0 0 0-5-2H4
                     a1 1 0 0 1-1-1z"/>

        </g>
    </symbol>

    <!-- MUSIC: Musical notes -->
    <symbol id="media-icon-album" viewBox="0 0 24 24">
        <g fill="none"
           stroke="#ffffff"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">

            <path d="M9 18V5l12-2v13"/>
            <circle cx="6" cy="18" r="3"/>
            <circle cx="18" cy="16" r="3"/>

        </g>
    </symbol>

    <!-- YOUTUBE: Circle play -->
    <symbol id="media-icon-youtube" viewBox="0 0 24 24">
        <g fill="none"
           stroke="#ffffff"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">

            <circle cx="12" cy="12" r="10"/>
            <path d="m10 8 6 4-6 4V8z"/>

        </g>
    </symbol>

    <!-- FUTURE MEDIA: Video Games -->
    <!-- Intentionally not referenced by any active button -->
    <symbol id="media-icon-game" viewBox="0 0 24 24">
        <g fill="none"
           stroke="#ffffff"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">

            <path d="M6 12h4"/>
            <path d="M8 10v4"/>
            <path d="M15 13h.01"/>
            <path d="M18 11h.01"/>
            <path d="M17.32 5H6.68
                     a4 4 0 0 0-3.978 3.59
                     c-.006.052-.01.101-.017.152
                     C2.614 9.332 2 14.452 2 16
                     a3 3 0 0 0 3 3
                     c1 0 1.5-.5 2-1l2-2
                     h6l2 2c.5.5 1 1 2 1
                     a3 3 0 0 0 3-3
                     c0-1.549-.614-6.668-.685-7.258
                     -.007-.05-.011-.1-.017-.151
                     A4 4 0 0 0 17.32 5z"/>

        </g>
    </symbol>

    <!-- FUTURE MEDIA: Art -->
    <!-- Intentionally not referenced by any active button -->
    <symbol id="media-icon-art" viewBox="0 0 24 24">
        <g fill="none"
           stroke="#ffffff"
           stroke-width="2"
           stroke-linecap="round"
           stroke-linejoin="round">

            <circle cx="13.5" cy="6.5" r=".5"/>
            <circle cx="17.5" cy="10.5" r=".5"/>
            <circle cx="8.5" cy="7.5" r=".5"/>
            <circle cx="6.5" cy="12.5" r=".5"/>
            <path d="M12 22a10 10 0 1 1 10-10
                     c0 1.66-1.34 3-3 3h-1.5
                     a1.5 1.5 0 0 0-1.5 1.5
                     c0 .4.2.8.4 1.1
                     c.3.4.6.9.6 1.4
                     a3 3 0 0 1-3 3z"/>

        </g>
    </symbol>

</svg>