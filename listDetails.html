<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogd | List Details</title>
    <link rel="stylesheet" href="css/stylingIndex.css">
    <link rel="stylesheet" href="css/stylingProfile.css">
    <link rel="stylesheet" href="css/stylingDetails.css">
    <link rel="stylesheet" href="css/stylingListDetails.css">
    <link rel="icon" type="image/x-icon" href="assets/catalogdFavicon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <app-header></app-header>

    <main class="profile-container">
        <div class="list-header-info">
            <div class="header-top-row" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
                <div class="header-titles">
                    <h1 id="list-name">Loading List...</h1>
                    <p id="list-desc" class="meta">Manage your collection below.</p>
                </div>

                <div class="list-controls" style="display: flex; gap: 10px;">
                    <button id="open-collab-modal-btn" class="secondary-btn" style="display:none;">Collaborators</button>
                    <button id="edit-list-btn" class="secondary-btn" style="display:none;">Edit List</button>
                </div>
            </div>
        </div>

        <div id="edit-list-modal" class="modal">
            <div class="modal-content social-modal-content" style="max-width: 450px;">
                <div class="modal-header">
                    <h2>Edit List</h2>
                    <button class="close-btn" id="close-edit-list-modal">×</button>
                </div>
                
                <div class="input-group">
                    <label style="color:#9ab; font-size:0.9rem; display:block; margin-bottom:5px;">List Name</label>
                    <input type="text" id="edit-list-name" style="width: 100%; box-sizing: border-box;">
                </div>
                
                <div class="input-group" style="margin-top: 15px;">
                    <label style="color:#9ab; font-size:0.9rem; display:block; margin-bottom:5px;">Description</label>
                    <textarea id="edit-list-desc" placeholder="What is this list about?" style="width: 100%; box-sizing: border-box; background: #14181c; border: 1px solid #2c3440; border-radius: 8px; color: white; padding: 12px; font-family: inherit; resize: vertical; min-height: 80px;"></textarea>
                </div>
                
                <div class="input-group" style="margin-top: 15px;">
                    <label style="color:#9ab; font-size:0.9rem; display:block; margin-bottom:5px;">Privacy</label>
                    <select id="edit-visibility-select" style="width: 100%; background: #14181c; border: 1px solid #2c3440; border-radius: 8px; color: white; padding: 12px;">
                        <option value="true">Public</option>
                        <option value="false">Private</option>
                    </select>
                </div>
                
                <div class="input-group" style="display: flex; align-items: center; gap: 10px; margin-top: 20px; background: rgba(255,255,255,0.03); padding: 15px; border-radius: 8px;">
                    <input type="checkbox" id="edit-ranked-toggle" style="width: 18px; height: 18px; accent-color: var(--accent); margin: 0; cursor: pointer;">
                    <div>
                        <label for="edit-ranked-toggle" style="margin: 0; cursor: pointer; font-weight: bold; color: white;">Ranked List</label>
                        <div style="font-size: 0.8rem; color: #9ab; margin-top: 3px;">Display numbers on posters and allow manual sorting.</div>
                    </div>
                </div>

                <div id="edit-tier-colors-section" style="display: none; margin-top: 20px; background: rgba(255,255,255,0.03); padding: 15px; border-radius: 8px;">
                    <label style="color:#9ab; font-size:0.9rem; display:block; margin-bottom:10px; font-weight:bold;">Tier Colors</label>
                    <div id="tier-colors-container" style="display: flex; flex-direction: column; gap: 8px;"></div>
                </div>
                
                <button id="save-list-edits-btn" class="primary-btn" style="margin-top: 25px; width: 100%;">Save Changes</button>
                <button id="delete-list-btn" class="danger-btn" style="margin-top: 10px; width: 100%; display: none;">Delete List</button>
            </div>
        </div>

        <section id="add-to-list-section" class="search-container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h3 style="margin: 0;">Add to List</h3>
                <button id="open-custom-card-modal" class="secondary-btn" style="padding: 6px 12px; font-size: 0.85rem; width: auto; margin: 0;">+ Custom Card</button>
            </div>
            <input type="text" id="list-search-input" placeholder="Search for something to add...">
            <div id="search-results" class="search-results-dropdown"></div>
        </section>

        <h2>Items in this List</h2>
        <div id="reorder-controls-container" style="margin-bottom: 20px; display: flex; gap: 10px;">
            <button id="manage-order-btn" class="secondary-btn" style="display:none;">Reorder Items</button>
            <button id="save-order-btn" class="primary-btn" style="display:none;">Save Order</button>
        </div>

        <div id="list-content" class="list-items-grid">
            <p class="meta">No items in this list yet.</p>
        </div>

        <div id="custom-card-modal" class="modal">
            <div class="modal-content social-modal-content" style="max-width: 400px;">
                <div class="modal-header">
                    <h2>Add Custom Card</h2>
                    <button class="close-btn" id="close-custom-card-modal">×</button>
                </div>
                <div class="input-group">
                    <input type="text" id="custom-card-name" placeholder="Name" style="width: 100%; box-sizing: border-box; margin-bottom: 10px;">
                    <input type="text" id="custom-card-img" placeholder="Image URL (Optional)" style="width: 100%; box-sizing: border-box; margin-bottom: 10px;">
                    <label style="color:#9ab; font-size:0.9rem; display:block; margin-bottom:5px;">Type</label>
                    <select id="custom-card-type" style="width: 100%; box-sizing: border-box; background: #14181c; border: 1px solid #2c3440; border-radius: 8px; color: white; padding: 12px; margin-bottom: 20px;">
                        <option value="movie">Movie</option>
                        <option value="tv">TV Show</option>
                        <option value="book">Book</option>
                        <option value="album">Music</option>
                        <option value="youtube">YouTube</option>
                        <option value="actor">Cast</option>
                        <option value="crew">Crew</option>
                        <option value="character">Character</option>
                        <option value="author">Author</option>
                        <option value="artist">Artist</option>
                        <option value="other">Other</option>
                    </select>
                    <button id="submit-custom-card" class="primary-btn" style="width: 100%;">Add Card</button>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script type="module" src="js/scriptingListDetails.js"></script>
    <script type="module" src="js/components/AppHeader.js"></script>
</body>
</html>
