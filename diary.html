<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogd | Diary</title>
    <link rel="stylesheet" href="css/stylingIndex.css">
    <link rel="stylesheet" href="css/stylingDiary.css">
    <link rel="icon" type="image/x-icon" href="assets/catalogdFavicon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <app-header></app-header>

    <main class="diary-container">
        <div class="diary-header">
            <h1>Diary</h1>
            <div class="diary-controls">
                <input type="text" id="diary-search" placeholder="Search titles...">
                <button id="toggle-filters-btn" class="secondary-btn">⚙️ Filters</button>
            </div>
        </div>

        <div id="advanced-filters" class="filter-panel">
            <select id="rating-filter">
                <option value="all">All Ratings</option>
                <option value="5">★★★★★</option>
                <option value="4">★★★★</option>
                <option value="3">★★★</option>
                <option value="2">★★</option>
                <option value="1">★</option>
            </select>
            <select id="year-filter">
                <option value="all">All Release Years</option>
                <!-- JS will populate this -->
            </select>
            <select id="liked-filter">
                <option value="all">Liked or Not</option>
                <option value="liked">Liked</option>
                <option value="unliked">Not Liked</option>
            </select>
            <select id="review-filter">
                <option value="all">Reviewed or Not</option>
                <option value="reviewed">Reviewed</option>
                <option value="unreviewed">Not Reviewed</option>
            </select>
            <select id="rewatch-filter">
                <option value="all">All Watches</option>
                <option value="rewatch">Rewatch/Reread</option>
                <option value="first">First Time</option>
            </select>
            <select id="tag-filter">
                <option value="all">All Tags</option>
                <!-- JS will populate this -->
            </select>
        </div>
        
        <div class="diary-stats">
            <div class="stat-item"><span id="total-logs">0</span> Logs</div>
            <div class="stat-item"><span id="avg-rating">0.0</span> Avg Rating</div> 
            <div class="stat-item"><span id="total-movies">0</span> Movies</div>
            <div class="stat-item"><span id="total-series">0</span> Series</div>
            <div class="stat-item"><span id="total-books">0</span> Books</div>
            <div class="stat-item"><span id="total-albums">0</span> Albums</div>
            <div class="stat-item"><span id="total-songs">0</span> Songs</div>
            <div class="stat-item"><span id="total-youtube">0</span> Videos</div>
            <div class="stat-item"><span id="total-time">0</span> Minutes</div>
        </div>

        <div class="filter-nav">
            <button id="btn-all" class="filter-btn active" data-diary-type="all">All</button>
            <button id="btn-movie" class="filter-btn" data-diary-type="movie">Movies</button>
            <button id="btn-tv" class="filter-btn" data-diary-type="tv">TV</button>
            <button id="btn-book" class="filter-btn" data-diary-type="book">Books</button>
            <button id="btn-album" class="filter-btn" data-diary-type="album">Music</button>
            <button id="btn-youtube" class="filter-btn" data-diary-type="youtube">YouTube</button>
        </div>

        <div class="table-wrapper">
            <table id="diary-table">
                <thead>
                    <tr>
                        <th data-sort="date" class="sortable">Date <span id="date-sort-icon">↓</span></th>
                        <th>Cover</th>
                        <th data-sort="name" class="sortable">Name <span id="name-sort-icon"></span></th>
                        <th data-sort="released" class="sortable">Released <span id="released-sort-icon"></span></th>
                        <th data-sort="rating" class="sortable">Rating <span id="rating-sort-icon"></span></th>
                        <th>Review</th>
                        <th>Tags</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="diary-body">
                    </tbody>
            </table>
            <div id="load-more-container">
                <button id="load-more-btn" class="secondary-btn">Load More Entries</button>
            </div>
        </div>
    </main>

    <div id="review-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <h2 id="modal-title">Review</h2>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/scriptingDiary.js"></script>
    <script type="module" src="js/components/AppHeader.js"></script>
</body>
</html>
