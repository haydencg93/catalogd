<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogd | Watchlist</title>
    <link rel="stylesheet" href="css/stylingIndex.css">
    <link rel="stylesheet" href="css/stylingWatchlist.css">
    <link rel="icon" type="image/x-icon" href="assets/catalogdFavicon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <app-header></app-header>

    <main class="profile-container">
        <h1>My Watchlist</h1>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <p class="meta" id="watchlist-subtitle" style="margin: 0; border: none; padding: 0;">Loading...</p>
            <div class="filter-nav">
                <button id="btn-all" class="filter-btn active" data-watchlist-filter="all">All</button>
                <button id="btn-movie" class="filter-btn" data-watchlist-filter="movie">Movies</button>
                <button id="btn-tv" class="filter-btn" data-watchlist-filter="tv">TV</button>
                <button id="btn-book" class="filter-btn" data-watchlist-filter="book">Books</button>
                <button id="btn-album" class="filter-btn" data-watchlist-filter="album">Music</button>
                <button id="btn-youtube" class="filter-btn" data-watchlist-filter="youtube">YouTube</button>
            </div>
        </div>
        
        <div class="grid" id="watchlist-grid"></div>
        <div id="watchlist-pagination" style="display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 40px; margin-bottom: 20px;"></div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/scriptingWatchlist.js"></script>
    <script type="module" src="js/components/AppHeader.js"></script>
</body>
</html>
