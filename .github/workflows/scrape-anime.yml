name: Anime Filler Scraper Worker

on:
  workflow_dispatch:
    inputs:
      anime_name:
        description: 'Anime name to scrape (Leave blank to check Supabase queue)'
        required: false
        default: ''
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'

jobs:
  build_and_scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./animeFillerListApi

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './animeFillerListApi/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run Scraper Worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANIME_NAME: ${{ github.event.inputs.anime_name }}
        run: node index.js "$ANIME_NAME"