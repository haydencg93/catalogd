name: Sync Test Branch to Beta

on:
  push:
    branches:
      - test
  workflow_dispatch:

jobs:
  sync-beta:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Test Branch
        uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 0
          persist-credentials: false

      - name: Push to Beta Repository
        env:
          BETA_TOKEN: ${{ secrets.CATALOGD_BETA_TOKEN }}
        run: |
          git remote add beta "https://x-access-token:${BETA_TOKEN}@github.com/haydencg93/catalogd-beta.git"
          git push beta HEAD:main