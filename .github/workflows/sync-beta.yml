name: Sync Test Branch to Beta

on:
  push:
    branches:
      - test
  workflow_dispatch:

jobs:
  sync-beta:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Test Branch
        uses: actions/checkout@v4
        with:
          ref: test
          fetch-depth: 0
          persist-credentials: false

      - name: Push to Beta Repository
        env:
          BETA_TOKEN: ${{ secrets.CATALOGD_BETA_TOKEN }}
        run: |
          beta_dir="$RUNNER_TEMP/catalogd-beta"

          git clone \
            --branch main \
            --single-branch \
            "https://x-access-token:${BETA_TOKEN}@github.com/haydencg93/catalogd-beta.git" \
            "$beta_dir"

          rsync -a --delete \
            --exclude='.git/' \
            "$GITHUB_WORKSPACE/" "$beta_dir/"

          python3 <<'PY'
          from pathlib import Path
          import re

          beta_dir = Path("${{ runner.temp }}/catalogd-beta")
          workflow_dir = beta_dir / ".github" / "workflows"

          workflow_files = [
              "hourly-emails.yml",
              "nightly-embed.yml",
              "nightly-vibes.yml",
              "scrape-anime.yml",
              "scrape-anime(1).yml",
              "update-stats.yml",
          ]

          for filename in workflow_files:
              path = workflow_dir / filename

              if not path.exists():
                  continue

              text = path.read_text()

              match = re.search(
                  r'(?ms)^on:\n(?P<body>.*?)(?=^[A-Za-z0-9_-]+:\s*$)',
                  text
              )

              if not match:
                  print(f"Could not find on: block in {filename}")
                  continue

              body_lines = match.group("body").splitlines()
              keep = []
              i = 0

              while i < len(body_lines):
                  line = body_lines[i]

                  if line.startswith("  workflow_dispatch:"):
                      keep.append(line)
                      i += 1

                      while i < len(body_lines):
                          child = body_lines[i]

                          if not child.strip():
                              keep.append(child)
                              i += 1
                              continue

                          indent = len(child) - len(child.lstrip(" "))

                          if indent >= 4:
                              keep.append(child)
                              i += 1
                          else:
                              break

                      break

                  i += 1

              if not keep:
                  keep = ["  workflow_dispatch:"]

              while keep and keep[-1] == "":
                  keep.pop()

              new_on_block = "on:\n" + "\n".join(keep) + "\n\n"

              text = (
                  text[:match.start()]
                  + new_on_block
                  + text[match.end():]
              )

              path.write_text(text)

              print(f"Made {filename} manual-only for beta")
          PY

          git -C "$beta_dir" config user.name "github-actions[bot]"
          git -C "$beta_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git -C "$beta_dir" add --all

          if git -C "$beta_dir" diff --cached --quiet; then
            echo "No beta changes to push."
          else
            git -C "$beta_dir" commit -m "Sync test branch ($GITHUB_SHA)"
            git -C "$beta_dir" push origin HEAD:main
          fi